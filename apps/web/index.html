    <!--
      글꼴. 지금까지 tailwind 에 font-rounded 를 적어 두고도 정작 글꼴 파일을
      불러오지 않아 기기 기본 글씨체로 보이고 있었다.
        나눔고딕   한글 본문 — 자모가 또렷이 갈라져 보인다. 한글을 배우는 앱이라
                  귀여움보다 이것이 먼저다 (둥글린 글꼴은 ㄹ·ㅁ·ㅂ 이 비슷해진다)
        Jua       홈의 놀이터 이름에만 쓰는 둥근 글씨 (영숙님 그림의 글씨와 결을 맞춘다)
        Pacifico  로그인 화면의 영문 이름에만 쓰는 장식 글씨
      인터넷이 끊기면 기기 기본 글씨로 내려가고 앱은 그대로 돌아간다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Jua&family=Pacifico&display=swap"
      rel="stylesheet"
    />
