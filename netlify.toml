# 넷리파이 배포 설정
#
# 이 저장소는 여러 꾸러미가 한 곳에 들어 있는 구조(pnpm workspace + turbo)라,
# 넷리파이에게 "어디서 만들고 무엇을 올릴지" 를 알려줘야 한다.
#
# 필요한 환경 변수 두 개는 넷리파이 화면에서 넣는다 (Site settings → Environment variables).
#   VITE_SUPABASE_URL       인터넷에 올린 Supabase 프로젝트 주소
#   VITE_SUPABASE_ANON_KEY  그 프로젝트의 anon key
# 이 값들은 화면에 그대로 노출되는 공개 값이라 저장소에 넣어도 되긴 하지만,
# 프로젝트를 옮길 때마다 코드를 고치지 않으려고 넷리파이 쪽에 둔다.

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # package.json 의 engines 와 맞춘다.
  NODE_VERSION = "20"
  PNPM_VERSION = "11.25.0"

# 화면 안에서 주소가 바뀌는 앱(SPA)이라, 어떤 주소로 들어와도 index.html 을 준다.
# 이게 없으면 새로고침했을 때 "페이지 없음" 이 뜬다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # 이름에 지문이 붙은 파일들이라 오래 캐시해도 안전하다.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # 서비스 워커는 캐시하면 안 된다 — 새로 올린 앱이 안 내려온다.
    Cache-Control = "no-cache"
